  :root{
    --lk-bg:#FBF9F4;
    --lk-ink:#2C3238;
    --lk-ring:#D8D3C7;
    --lk-hot:#0F62D6;
    --lk-text:#17191C;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%}

  .lk-wrap{
    display:flex;flex-direction:column;align-items:center;gap:22px;
    transition:opacity .5s ease, transform .5s ease;
  }
  .lk-wrap.lk-out{opacity:0;transform:scale(1.06)}

  /* ---------- stage ----------
     年份和插画是同一个 flex 列里的兄弟节点：上下错开，永不重叠，
     所以"数字被遮挡"在结构上就不可能发生。

     一个变量决定整块尺寸：宽度、字号、行距全部由 --s 推导，所以任何尺寸的
     设备上比例完全一致。三个约束分别是"别超出宽度""别超过 360""别超出高度"
     —— 最后一条是横屏手机（如 667x375）能正常显示的关键。 */
  .lk-stage{
    --s:min(72vw, 360px, calc(100vh - 96px));
    position:relative;
    width:var(--s);aspect-ratio:1;
    display:flex;flex-direction:column;align-items:center;justify-content:center;
    row-gap:calc(var(--s) * .044);   /* flex 不支持百分比 gap，会整条丢弃 */
  }
  .lk-rings{position:absolute;inset:0;width:100%;height:100%;overflow:visible;z-index:0}
  .lk-glow{
    position:absolute;left:50%;top:50%;
    width:86%;aspect-ratio:1;transform:translate(-50%,-50%);
    background:radial-gradient(circle, rgba(15,98,214,.10) 0%, rgba(15,98,214,.04) 44%, transparent 70%);
    z-index:0;pointer-events:none;
    animation:lk-breathe 3.2s ease-in-out infinite;
  }
  @keyframes lk-breathe{0%,100%{opacity:.7}50%{opacity:1}}

  /* ---------- 年份 ----------
     数字相对自己往下移 35.15% 舞台，让云朵落在它一半高度上。
     用 position:relative + top（相对位移），不是负外边距 —— 负外边距会把
     插画一起拉上来，"移动数字"和"移动主体"在视觉上不是一回事。
     图层在后面（z-index 低于插画）：主体压在数字之上，数字从云的上下探出来。
     At 0.28 the gold reads as bronze rather than mud, and it lifts to 0.46
     once real progress arrives. */
  .lk-year{
    position:relative;z-index:1;
    top:calc(var(--s) * .3515);
    font-family:'Nianlun Digits', Georgia, 'Times New Roman', serif;
    font-size:calc(var(--s) * .372);font-weight:700;
    letter-spacing:.01em;line-height:1;
    font-variant-numeric:tabular-nums lining-nums;
    font-feature-settings:"tnum" 1,"lnum" 1;
    color:#f0bd63;opacity:.34;
    pointer-events:none;user-select:none;
    transition:opacity .4s ease;
  }
  .lk-stage.lk-hasprogress .lk-year{opacity:.56}

  /* ---------- 插画 ----------
     在数字之上。viewBox 已经把重心定在底部横线上（见文件头），
     所以流里水平居中就等于横线落在中轴上。 */
  .lk-art{position:relative;z-index:2;width:96%;pointer-events:none}
  .lk-art .lk-fox-svg{)}

  /* ---------- 年轮 ---------- */
  .lk-ring{
    fill:none;stroke:var(--lk-ring);stroke-width:1;
    transform-origin:200px 200px;opacity:0;
    animation:lk-ripple 2.8s cubic-bezier(.22,.61,.36,1) infinite;
  }
  .lk-ring:nth-child(1){animation-delay:0s}
  .lk-ring:nth-child(2){animation-delay:.32s}
  .lk-ring:nth-child(3){animation-delay:.64s}
  .lk-ring:nth-child(4){animation-delay:.96s}
  .lk-ring:nth-child(5){animation-delay:1.28s}
  .lk-ring:nth-child(6){animation-delay:1.60s}
  @keyframes lk-ripple{
    0%{transform:scale(.34);opacity:0}
    12%{opacity:.9}
    70%{opacity:.22}
    100%{transform:scale(1);opacity:0}
  }

  .lk-arc{
    fill:none;stroke:var(--lk-hot);stroke-width:2;stroke-linecap:round;
    transform:rotate(-90deg);transform-origin:200px 200px;
    opacity:0;transition:opacity .3s ease;
  }
  .lk-stage.lk-hasprogress .lk-arc{opacity:1}

  /* ---------- 刘看山：描边自绘 ---------- */
  .lk-fox-svg{height:auto;display:block;overflow:hidden}
  .lk-fox-svg path{
    stroke-dasharray:var(--lk-len,1000);
    stroke-dashoffset:var(--lk-len,1000);
    fill-opacity:0;
    animation:
      lk-draw .5s cubic-bezier(.5,0,.2,1) forwards var(--lk-delay,0s),
      lk-fill .34s ease forwards calc(var(--lk-delay,0s) + .46s);
  }
  @keyframes lk-draw{to{stroke-dashoffset:0}}
  @keyframes lk-fill{to{fill-opacity:1}}

  /* ellipses are not part of the line-draw sequence; they just fade in */
  .lk-fox-svg ellipse{opacity:0;animation:lk-appear .4s ease forwards var(--lk-edelay,.9s)}
  @keyframes lk-appear{to{opacity:1}}

  /* --- the character is alive: it blinks --- */
  .lk-fox-svg [data-e="0"]{
    transform-box:fill-box;transform-origin:center;
    animation:lk-appear .4s ease forwards var(--lk-edelay,.9s),
              lk-blink 5.4s ease-in-out 1.6s infinite;
  }
  @keyframes lk-blink{
    0%,90%,100%{transform:scaleY(1)}
    94%,96%{transform:scaleY(.06)}
  }

  /* --- sun rays turn like a clock hand: time is the subject --- */
  .lk-sun{transform-box:fill-box;transform-origin:center;animation:lk-clock 18s linear infinite}
  @keyframes lk-clock{to{transform:rotate(360deg)}}

  /* --- clouds drift --- */
  .lk-cloud{animation:lk-drift 26s ease-in-out infinite}
  @keyframes lk-drift{0%,100%{transform:translateX(0)}50%{transform:translateX(-9px)}}

  /* --- tumbleweed rolls past: time moving through the desert --- */
  .lk-tumble{
    animation:lk-roll 11s linear infinite;
    opacity:0;
  }
  @keyframes lk-roll{
    0%{transform:translate(26px,6px);opacity:0}
    12%{opacity:.95}
    82%{opacity:.95}
    100%{transform:translate(-34px,-2px);opacity:0}
  }

  /* ---------- 文案：流里的最后一行 ---------- */
  .lk-text{text-align:center}
  .lk-title{font-size:15px;letter-spacing:.34em;color:var(--lk-text);margin-bottom:9px;font-weight:500}
  .lk-sub{font-size:13px;color:var(--lk-ink);letter-spacing:.05em;height:1.4em;transition:opacity .35s ease}
  .lk-sub.lk-fade{opacity:0}

  @media (prefers-reduced-motion:reduce){
    .lk-ring,.lk-glow,.lk-sun,.lk-cloud,.lk-tumble,.lk-fox-svg [data-e="0"]{animation:none}
    .lk-ring{opacity:.3}
    .lk-tumble{opacity:0}
    .lk-fox-svg path{stroke-dashoffset:0;fill-opacity:1;animation:none}
    .lk-fox-svg ellipse{opacity:1;animation:none}
  }


/* 打开动画那一层：铺满首屏，播完淡出 */
#opening{
  position:fixed;inset:0;z-index:100;
  background:#FBF9F4;
  display:flex;align-items:center;justify-content:center;
  transition:opacity .72s cubic-bezier(.22,.61,.36,1),
             visibility 0s linear .72s;
}
#opening.gone{opacity:0;visibility:hidden;pointer-events:none}

/* ══ 网站本体 ══ */
:root{
  --paper:#FBF9F4; --ink:#17191C; --grey:#6B7280; --dot:#DDE1E6;
  --accent:#0F62D6; --doubt:#B4472F; --believe:#2F6B4F;
  --line:#E6E2D9;
  --ease:cubic-bezier(.22,.61,.36,1);
  /* 黄金分割 */
  --phi-s:38.2%; --phi-l:61.8%;
}
*{margin:0;padding:0;box-sizing:border-box}
html,body{overflow-x:clip}
body{
  background:var(--paper);color:var(--ink);
  font-family:"PingFang SC","Microsoft YaHei",system-ui,sans-serif;
  -webkit-font-smoothing:antialiased;line-height:1.7;
}

/* ── 首屏：搜索框居中 ── */
#hero{
  position:fixed;inset:0;z-index:20;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  background:var(--paper);
  /* 标题落在视口上方黄金分割点，不是几何正中 */
  padding-bottom:12vh;
  opacity:0;
  transition:opacity .6s var(--ease);
}
/* 首屏可见性只由 JS 的内联 style 控制，CSS 这里不写第二条规则。
   踩过的坑：原来靠兄弟选择器让首屏露出来，
   但 opening.remove() 一把 #opening 摘掉，选择器当场失配，
   #hero 掉回 opacity:0 —— 表现就是首屏闪一下就没了。 */
#hero.gone{opacity:0;pointer-events:none}
.hero-title{
  font-size:clamp(30px,5vw,50px);font-weight:800;letter-spacing:.02em;
  font-family:"Songti SC",SimSun,serif;text-align:center;
}
.hero-sub{
  margin-top:10px;font-size:15px;color:var(--grey);text-align:center;
  max-width:420px;line-height:1.7;
}
.hero-search{
  margin-top:38px;display:flex;gap:10px;width:min(520px,90vw);
  position:relative;      /* 推荐浮层按它定位，不参与布局 */
}
.hero-search input{
  flex:1;height:50px;padding:0 20px;font-size:16px;
  border:1.8px solid var(--ink);border-radius:28px;
  background:var(--paper);color:var(--ink);outline:none;font-family:inherit;
  transition:border-color .2s,box-shadow .2s;
}
.hero-search input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(15,98,214,.12)}
/* 只作用于「翻旧账」那个按钮，用 **>** 限定成直接子元素。
   否则这两条会漏进推荐层（.sugbox）里：height:50px 和 border-radius:28px
   都不是 .sugbox button 声明的属性，于是被继承过去 —— 推荐行的行高和圆角
   就跟顶栏那份对不上了。跟 #topbar > button 是同一个坑。 */
.hero-search > button{
  height:50px;padding:0 28px;font-size:15px;font-weight:600;
  border:1.8px solid var(--ink);border-radius:28px;
  background:var(--ink);color:var(--paper);cursor:pointer;font-family:inherit;
  white-space:nowrap;transition:background .2s,opacity .2s;
}
.hero-search > button:hover{background:#2d3138}
.hero-search > button:disabled{opacity:.4;cursor:not-allowed}
.hero-hints{
  margin-top:16px;display:flex;flex-wrap:wrap;gap:8px;
  justify-content:center;max-width:min(560px,92vw);
}
.hero-hints span{font-size:12px;color:var(--grey)}
.hero-hints button{
  font-size:12px;padding:4px 14px;border-radius:14px;cursor:pointer;
  border:1px solid var(--line);background:transparent;color:var(--grey);
  font-family:inherit;transition:border-color .15s,color .15s;
}
.hero-hints button:hover{border-color:var(--accent);color:var(--accent)}

/* ── 输入推荐 ──
   输入关键词就出，靠的是**一条**搜索调用（0.76s），不是那 15 条扇出（13s）。
   候选是知乎给出的真实标题，原样照搬、不改写、不生成。
   绝对定位挂在输入框下面：出推荐时页面不跳，首屏那些元素一动不动。

   首屏（.hero-search）和顶栏（.tb-search）两个输入框共用这一套 ——
   只挂首屏的话，搜过一次首屏就藏起来了，顶栏再输入就没推荐了。 */
.sugbox{
  position:absolute;top:calc(100% + 8px);left:0;right:0;z-index:30;
  display:none;max-height:min(46vh,360px);overflow-y:auto;overscroll-behavior:contain;
  border:1px solid var(--line);border-radius:12px;background:var(--paper);
  box-shadow:0 16px 38px -18px rgba(23,25,28,.26);
}
.sugbox.show{display:block}
.sugbox .s-hd{
  padding:7px 16px;font-size:11.5px;color:var(--grey);
  background:rgba(15,98,214,.045);
}
.sugbox button{
  display:flex;gap:12px;align-items:baseline;width:100%;
  padding:9px 16px;border:none;border-top:1px solid var(--line);
  background:transparent;cursor:pointer;font-family:inherit;
  font-size:13.5px;color:var(--ink);text-align:left;line-height:1.5;
}
.sugbox button:first-of-type{border-top:none}
.sugbox button:hover{background:rgba(15,98,214,.05)}
.sugbox button:hover .s-t{color:var(--accent)}
.sugbox .s-t{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.sugbox .s-v{flex:none;font-size:11.5px;color:var(--grey);
             font-variant-numeric:tabular-nums}

/* ── 顶栏：搜索后搜索框上移缩短 ── */
#topbar{
  position:fixed;top:0;left:0;right:0;z-index:19;
  background:rgba(251,249,244,.92);backdrop-filter:blur(8px);
  border-bottom:1px solid var(--line);
  padding:12px 24px;display:flex;align-items:center;gap:12px;
  transform:translateY(-100%);
  transition:transform .55s var(--ease);
}
#topbar.visible{transform:translateY(0)}
#topbar .tb-title{
  font-weight:800;font-size:18px;font-family:"Songti SC",SimSun,serif;
  white-space:nowrap;cursor:pointer;
}
/* 顶栏的输入框也要能出推荐（搜过一次之后首屏就藏起来了，
   这时能打字的就是这一个），所以给它一个定位容器 */
.tb-search{position:relative;flex:1;max-width:380px}
.tb-search input{width:100%}
#topbar input{
  height:40px;padding:0 16px;font-size:14px;
  border:1.5px solid var(--ink);border-radius:22px;
  background:var(--paper);color:var(--ink);outline:none;font-family:inherit;
}
#topbar input:focus{border-color:var(--accent);box-shadow:0 0 0 3px rgba(15,98,214,.1)}
/* 只作用于「翻旧账」那个按钮，用 **>** 限定成直接子元素。
   否则这条带 id 的规则（特异性 1,0,1）会盖掉 .sugbox button（0,1,1），
   把推荐层里每一行都染成深墨底 + 纸色字 —— 踩过。
   首屏那边曾用 .hero-search button（0,1,1），跟 .sugbox 打平、靠书写顺序
   侥幸没露馅，但 height/radius 仍会漏过去；两边现在都用 > 限定了。 */
#topbar > button{
  height:40px;padding:0 20px;font-size:14px;font-weight:600;
  border:1.5px solid var(--ink);border-radius:22px;
  background:var(--ink);color:var(--paper);cursor:pointer;font-family:inherit;
  white-space:nowrap;
}
#topbar > button:hover{background:#2d3138}
#topbar > button:disabled{opacity:.4;cursor:not-allowed}

/* ── 主体：上下分区，整页可滚 ── */
/* 不用 fixed 了：文章区现在是真的第二节，得靠文档流把它顶到
   年轮下面，页面才滚得动。display 切换而不是 opacity，
   否则没搜索时它也占着高度，首屏背后会多出一条滚动条。 */
#main{display:none;padding-top:76px}
#main.visible{display:block;animation:fadein .45s var(--ease)}
@keyframes fadein{from{opacity:0}to{opacity:1}}
/* 状态行：顶栏之下、年轮之上，占布局高度 */
#status{
  padding:0 28px;
  max-width:min(760px,92vw);
  font-size:12.5px;color:var(--grey);line-height:1.6;
}

/* ── 候选说法条 ──
   用户输入的不是断言时（比如只输了个「张雪峰」），在结果上方给几条
   改写好的说法让他一键换。**刻意不阻塞**：结果已经照原话搜出来了，
   这条只是提示，点不点都行 —— 拿几秒的模型往返去挡在搜索前面，
   换来的是"每次都多等一段"，不值。 */
.hintbar{
  display:none;align-items:center;flex-wrap:wrap;gap:8px;
  margin:0 28px 12px;padding:10px 14px;
  border-left:2.5px solid var(--accent);
  background:rgba(15,98,214,.045);border-radius:0 8px 8px 0;
  font-size:12.5px;color:var(--grey);
}
.hintbar.show{display:flex}
.hintbar .hb-label{color:var(--ink)}
.hintbar button.hb-chip{
  font-size:12.5px;padding:4px 14px;border-radius:14px;cursor:pointer;
  border:1px solid var(--line);background:var(--paper);color:var(--ink);
  font-family:inherit;transition:border-color .15s,color .15s;
  /* 候选是知乎上真实存在的标题，可能很长 —— 按钮里截断显示，
     完整那句挂在 title 和 data-q 上：hover 看得到，点了搜的也是完整那句 */
  max-width:min(400px,70vw);overflow:hidden;text-overflow:ellipsis;
  white-space:nowrap;text-align:left;
}
.hintbar button.hb-chip:hover{border-color:var(--accent);color:var(--accent)}
.hintbar .hb-close{
  margin-left:auto;border:none;background:transparent;cursor:pointer;
  color:var(--grey);font-size:16px;line-height:1;padding:2px 6px;
}
.hintbar .hb-close:hover{color:var(--ink)}

/* ══ 年轮：页面顶部一块长方形 ══
   不再铺满视口。同心圆是这块里的背景纹理，
   年份沿一条弧线从中心（偏右上）排到这块的左下角。
   弧线几何是按这块的宽高解的，跟以前一样自适应；
   多出来的环线由 overflow:hidden 裁掉，不侵入下面的文章区。 */
.stage{
  position:relative;
  width:100%;
  height:clamp(520px,66vh,700px);
  margin-top:10px;
  overflow:hidden;
  pointer-events:none;
}
.ringbox{
  position:absolute;inset:0;
  width:100%;height:100%;
  pointer-events:auto;
}
.ringbox svg{width:100%;height:100%;display:block;overflow:visible}

/* ── 年轮 ──
   环线退成背景纹理：比原来更淡，因为现在它铺满整页，
   跟内容抢注意力就会很吵。 */
.ring{fill:none;stroke:var(--line);stroke-width:1;opacity:.55}
.ring.on{stroke:var(--dot);opacity:.9}
.node{cursor:pointer}
.node circle{fill:var(--paper);stroke:var(--ink);stroke-width:1.6;
             transition:r .28s var(--ease),fill .2s,stroke .2s}
.node text.yr{font-size:13px;fill:var(--ink);letter-spacing:.06em;font-weight:600;
           font-variant-numeric:tabular-nums;user-select:none;
           paint-order:stroke fill;stroke:var(--paper);stroke-width:4px;
           stroke-linejoin:round;transition:fill .2s}
/* 条数：年份下面一行小字，让数据量直接可读 */
.node text.cnt{font-size:10px;fill:var(--grey);letter-spacing:.02em;
           font-variant-numeric:tabular-nums;user-select:none;
           paint-order:stroke fill;stroke:var(--paper);stroke-width:3.5px;
           stroke-linejoin:round;transition:fill .2s}
.node:hover circle{stroke:var(--accent)}
.node:hover text.yr{fill:var(--accent)}
.node.sel circle{fill:var(--accent);stroke:var(--accent)}
.node.sel text.yr{fill:var(--accent);font-weight:800}
.seedtext{font-size:15px;fill:var(--ink);font-weight:700;text-anchor:middle;
          paint-order:stroke fill;stroke:var(--paper);stroke-width:5px;stroke-linejoin:round}
.seedsub{font-size:11px;fill:var(--grey);text-anchor:middle;
         paint-order:stroke fill;stroke:var(--paper);stroke-width:4px;stroke-linejoin:round}
.seedhole{fill:var(--paper)}
@keyframes ringdraw{from{stroke-dashoffset:var(--len)}to{stroke-dashoffset:0}}
@keyframes nodein{from{opacity:0;transform:scale(.4)}to{opacity:1;transform:scale(1)}}
.anim .ring{stroke-dasharray:var(--len);animation:ringdraw .9s var(--ease) both;
            animation-delay:var(--d)}
.anim .node{opacity:0;transform-box:fill-box;transform-origin:center;
            animation:nodein .5s var(--ease) both;animation-delay:calc(var(--d) + .34s)}

/* 检索等待：中心呼吸空圈。
   不再需要右栏灰条 —— 现在没有右栏，等待态就是年轮自己在呼吸。 */
@keyframes breathe{0%,100%{opacity:.22}50%{opacity:.6}}
.skeleton circle{fill:none;stroke:var(--line);stroke-width:1.1;
                 animation:breathe 1.9s ease-in-out infinite;
                 animation-delay:var(--d)}
.loadword{font-size:13px;fill:var(--grey);text-anchor:middle;letter-spacing:.2em}

/* ── 文章区：年轮下面第二节 ──
   不再是点开后盖在年轮上的浮层。它有自己的位置，
   搜完就摆在这儿（默认选中最近一年），点年份换的是它的内容。
   窄栏居中：一屏 860px 的行宽读起来才不费劲。 */
.panel{
  max-width:860px;
  margin:0 auto;
  padding:18px 28px 90px;
  border-top:1px solid var(--line);
}
.yearhead{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.yearhead h2{font-size:30px;font-weight:800;font-variant-numeric:tabular-nums;
             font-family:"Songti SC",SimSun,serif}
.yearhead .meta{font-size:13px;color:var(--grey)}
.summary{margin-top:14px;padding:16px 18px;border-left:2.5px solid var(--accent);
         background:rgba(15,98,214,.045);border-radius:0 8px 8px 0}
.summary p{font-size:16px;line-height:1.85;font-family:"Songti SC",SimSun,serif}
.summary .from{margin-top:8px;font-size:12px;color:var(--grey)}
.summary .from em{font-style:normal;color:var(--ink)}
/* AI 挑句的标记：摘要那句到底是启发式挑的还是模型挑的，如实标出来 */
.aibadge{
  display:inline-block;font-size:10.5px;padding:0 6px;border-radius:8px;
  border:1px solid rgba(15,98,214,.35);color:var(--accent);
  margin-left:6px;vertical-align:1px;
}
.bar{display:flex;height:6px;border-radius:3px;overflow:hidden;margin-top:16px;
     background:var(--line)}
.bar i{display:block;height:100%}
.bar .b{background:var(--believe)} .bar .d{background:var(--doubt)}
.bar .m{background:var(--dot)}
.barlegend{margin-top:8px;font-size:12px;color:var(--grey);display:flex;
           gap:16px;flex-wrap:wrap;align-items:center}
.barlegend b{font-weight:600;color:var(--ink)}
.barlegend .dotb,.barlegend .dotd,.barlegend .dotm{
  display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:5px}
.barlegend .dotb{background:var(--believe)}
.barlegend .dotd{background:var(--doubt)}
.barlegend .dotm{background:var(--dot)}
.list{margin-top:22px;display:flex;flex-direction:column;gap:2px}
.item{display:block;padding:14px 2px;border-top:1px solid var(--line);
      text-decoration:none;color:inherit;transition:background .15s}
.item:hover{background:rgba(15,98,214,.04)}
.item .t{font-size:15px;font-weight:600;line-height:1.5}
.item:hover .t{color:var(--accent)}
.item .x{margin-top:6px;font-size:13.5px;color:var(--grey);line-height:1.75}
.item .f{margin-top:8px;font-size:12px;color:var(--grey);display:flex;
         gap:14px;flex-wrap:wrap;align-items:center}
.tag{font-size:11px;padding:1px 8px;border-radius:10px;border:1px solid var(--line)}
.tag.d{color:var(--doubt);border-color:rgba(180,71,47,.35)}
.tag.b{color:var(--believe);border-color:rgba(47,107,79,.35)}
.note{margin-top:28px;padding-top:16px;border-top:1px solid var(--line);
      font-size:12px;color:var(--grey);line-height:1.8}
.empty{color:var(--grey);font-size:14px;padding:40px 0}

@media (prefers-reduced-motion:reduce){
  .anim .ring,.anim .node{animation:none;stroke-dashoffset:0;opacity:1;transform:none}
  #opening,#hero,#topbar{transition:none}
  #main{animation:none}
}
</style>
</head>

<script>
/* 刘看山打开动画的原始 API（提取自 liukanshan-loader.html，仅改了年份时长） */

(function () {
  var NS = 'http://www.w3.org/2000/svg';
  var svg = document.querySelector('.lk-fox-svg');

  // 1. Drawing order + per-path stroke length so each stroke draws itself.
  var paths = [].slice.call(svg.querySelectorAll('path'));
  paths.forEach(function (p, i) {
    var len = 1000;
    try { len = Math.ceil(p.getTotalLength()) || 1000; } catch (e) {}
    p.style.setProperty('--lk-len', len);
    p.style.setProperty('--lk-delay', (i * 0.04).toFixed(3) + 's');
  });

  // 2. Group parts that must move together. Wrapping is only safe when the
  //    members already share a parent, otherwise transforms would shift them.
  function group(selectors, cls) {
    var els = [];
    selectors.forEach(function (s) {
      var n = svg.querySelector(s);
      if (n) els.push(n);
    });
    if (els.length < 2) return null;
    var parent = els[0].parentNode;
    if (!els.every(function (e) { return e.parentNode === parent; })) return null;
    var g = document.createElementNS(NS, 'g');
    g.setAttribute('class', cls);
    parent.insertBefore(g, els[0]);
    els.forEach(function (e) { g.appendChild(e); });
    return g;
  }

  // sun disc (ellipse #1) + its rays (path #5) turn together
  group(['[data-p="5"]', '[data-e="1"]'], 'lk-sun');
  // tumbleweed: outer spiral (6) + inner spiral (7)
  group(['[data-p="6"]', '[data-p="7"]'], 'lk-tumble');
  // the two clouds live in a single path (13)
  var cloud = svg.querySelector('[data-p="13"]');
  if (cloud) cloud.classList.add('lk-cloud');

  // 3. Progress arc + the year scrubber: loading progress IS time advancing.
  var arc = document.getElementById('lk-arc');
  var R = 184, C = 2 * Math.PI * R;
  arc.style.strokeDasharray = C;
  arc.style.strokeDashoffset = C;

  var yearEl = document.getElementById('lk-year');
  var YEAR_FROM = 2010, YEAR_TO = 2026;
  var YEAR_RUN_MS = 2200;          // fast off the line, long slow settle on 2026
  var stage = document.getElementById('lk-stage');
  var wrap = document.getElementById('lk-wrap');
  var sub = document.getElementById('lk-sub');
  var timer = null;
  var yearRaf = null, yearT0 = 0, yearRunning = false, yearExternal = false, lastYear = -1;

  // 先快后慢. easeOutCubic covers most of the distance in the first third and
  // then crawls, so the number visibly decelerates and locks onto 2026.
  function easeOutCubic(t) { return 1 - Math.pow(1 - t, 3); }

  function paintYear(v) {
    var t = Math.max(0, Math.min(1, v));
    var y = Math.round(YEAR_FROM + (YEAR_TO - YEAR_FROM) * easeOutCubic(t));
    if (y !== lastYear) { lastYear = y; yearEl.textContent = String(y); }
  }

  function yearLoop(ts) {
    if (!yearRunning || yearExternal) return;
    if (!yearT0) yearT0 = ts;
    var t = Math.min(1, (ts - yearT0) / YEAR_RUN_MS);
    paintYear(t);
    if (t < 1) { yearRaf = requestAnimationFrame(yearLoop); }
    else { yearRunning = false; }   // 定格在 2026，不回跳
  }

  var LINES = [
    '正在翻时间轴…',
    '正在找第一个说这话的人…',
    '正在数有几个人说中了…',
    '正在算还剩多少保质期…'
  ];
  var li = 0;

  window.LiukanshanLoader = {
    start: function () {
      // the year runs once on its own: fast -> slow -> holds on 2026
      yearRunning = true; yearT0 = 0;
      yearRaf = requestAnimationFrame(yearLoop);
      timer = setInterval(function () {
        sub.classList.add('lk-fade');
        setTimeout(function () {
          li = (li + 1) % LINES.length;
          sub.textContent = LINES[li];
          sub.classList.remove('lk-fade');
        }, 350);
      }, 2200);
    },

    progress: function (v) {
      if (v == null) { stage.classList.remove('lk-hasprogress'); return; }
      stage.classList.add('lk-hasprogress');
      var p = Math.max(0, Math.min(1, v));
      arc.style.strokeDashoffset = C * (1 - p);
      // real progress takes over and advances the year on the same curve
      yearExternal = true; yearRunning = false;
      if (yearRaf) cancelAnimationFrame(yearRaf);
      paintYear(p);
    },

    done: function (onGone) {
      clearInterval(timer);
      yearExternal = true; yearRunning = false;
      if (yearRaf) cancelAnimationFrame(yearRaf);
      sub.textContent = '好了';
      paintYear(1);                 // 定格 2026
      stage.classList.add('lk-done');
      setTimeout(function () {
        wrap.classList.add('lk-out');
        setTimeout(function () { if (onGone) onGone(); }, 520);
      }, 620);
    }
  };
})();

/* 把时长挂出来给 app.js 读，省得两边各写一个数字、改一处忘一处 */
window.LK_YEAR_RUN_MS = 2200;
</script>

     loading  搜索框上移成顶栏，年轮那块画呼吸空圈，文章区清空
     result   年轮由内向外描出来，默认选中最近一年，点年份换下面的文章

   年轮本身的画法和布局解算沿用上一版，未改。
   ─────────────────────────────────────────────────────────────*/

const SVG = 'http://www.w3.org/2000/svg';
const $ = (s) => document.querySelector(s);

const opening  = $('#opening');
const hero     = $('#hero');
const heroQ    = $('#hero-q');
const heroGo   = $('#hero-go');
const topbar   = $('#topbar');
const tbQ      = $('#tb-q');
const tbGo     = $('#tb-go');
const tbHome   = $('#tb-home');
const mainEl   = $('#main');
const statusEl = $('#status');
const hintbar  = $('#hintbar');
const heroSug  = $('#hero-sug');
const tbSug    = $('#tb-sug');
const stage    = $('.stage');
const box      = $('#rings');
const panel    = $('#panel');

/* 几何：年轮是页顶一块长方形，圆心就落在这块的正中，年份沿一个正圆
   均匀排开（从正上方起，顺时针一年一格）。
   所有量都按这块的宽高算，写成函数而不是常量 —— 换视口/换块高都自适应。 */
const GEO = {
  r0: 85,        // 中心留白的半径上限，那句话的地盘
  margin: 22,    // 标签盒离框边至少留这么远
  gap: 14,       // 节点圆外缘到标签内缘的距离
  tex: 0.95,     // 背景环线最大画到「框的长边 × 这个数」，超出的由 overflow 裁掉
};

/* 标签盒：横排两行（年份 + 条数）的外接矩形。
   值是**略大于实际渲染**的估计值 —— 宁可把圆算小一点，
   也不能算小了让标签顶出框。 */
function labelBox(n, vw) {
  if (n > 16) return { w: 38, h: 27, yr: 11, cnt: 8 };
  if (n > 12) return { w: 42, h: 30, yr: 12, cnt: 9 };
  if (vw < 560) return { w: 38, h: 27, yr: 11, cnt: 8 };
  return { w: 46, h: 32, yr: 13, cnt: 10 };
}

let VW = 0, VH = 0;        // 年轮那一块（.stage）的宽高，不是视口
let DATA = null, selected = null;
let state = 'opening';
/* 每发起一次检索就 +1。AI 那两条是异步后到的，回来时如果 token 变了，
   说明用户已经搜下一句了 —— 直接丢掉，别把上一句的结果糊到当前页面上。 */
let searchToken = 0;
/* AI 判断出来的输入形态（claim/topic/question/garbage）。
   候选说法条要等它 + DATA.related 都齐了才画，见 renderHint()。 */
let parseKind = null;

/* 量年轮那块。页面现在是可滚动的文档流，不能再拿 window.innerWidth/Height ——
   那量的是视口，跟年轮的框早就不是一回事了。 */
function measure() {
  const r = stage.getBoundingClientRect();
  VW = r.width; VH = r.height;
}

/* ════════════════════════════════════════════════════════════
   0. 打开动画
   ════════════════════════════════════════════════════════════
   动画本身是 liukanshan-loader 那套，年份 2010→2026 自己跑完。
   这里只管什么时候收场：等它把 2026 定格，再停 1 秒（让人看清
   这个数字，也让描线动画走完最后一段），然后淡出交给首屏。 */

const OPEN_HOLD = 600;   // 2026 定格后再停多久

function runOpening() {
  const yearEl = document.getElementById('lk-year');

  const finish = () => {
    if (state !== 'opening') return;
    state = 'idle';
    // 直接用 JS 设透明度，不依赖 CSS class 选择器
    hero.style.opacity = '1';
    hero.style.pointerEvents = 'auto';
    requestAnimationFrame(() => {
      opening.classList.add('gone');
      setTimeout(() => { opening.remove(); heroQ.focus(); }, 760);
    });
  };

  // 没拿到动画就直接放行，不让一个装饰件卡住入口
  if (!window.LiukanshanLoader || !yearEl) { finish(); return; }

  window.LiukanshanLoader.start();

  // 年份从 2010 爬到 2026 要跑 RUN_MS，跑完停住。
  // 时长由页面注入（window.LK_YEAR_RUN_MS），跟动画脚本里的常量同源，
  // 不在这儿再写死一个数字 —— 改一处忘一处是迟早的事。
  // 不用 LiukanshanLoader.done() 的内置淡出：它会先把 lk-wrap 整体隐藏，
  // 再回调 finish，中间那段时间用户看到的是空白。
  const RUN_MS = window.LK_YEAR_RUN_MS || 2200;
  setTimeout(() => {
    if (state !== 'opening') return;
    // 年份定格在 2026（不触发 done 的内置淡出）
    if (yearEl) yearEl.textContent = '2026';
    finish();
  }, RUN_MS + OPEN_HOLD);

  // 兜底：整段开场再宽限 3 秒，无论如何都放行，不把人堵在门口
  setTimeout(() => { if (state === 'opening') finish(); }, RUN_MS + OPEN_HOLD + 3000);
}

/* ════════════════════════════════════════════════════════════
   1. 三段状态切换
   ════════════════════════════════════════════════════════════*/

function toLoading(q) {
  state = 'loading';
  // 首屏的可见性统一走内联 style：finish() 里已经写过 style.opacity='1'，
  // 内联优先级高于 class，再加 .gone 是压不住的。
  hero.style.opacity = '0';
  hero.style.pointerEvents = 'none';
  topbar.classList.add('visible');
  mainEl.classList.add('visible');
  tbQ.value = q;
  statusEl.textContent = '刘看山正在翻…… 这句话要往回查十几年，慢一点。';
  panel.innerHTML = '';
  window.scrollTo(0, 0);
  skeleton();
}

function toResult(d) {
  state = 'result';
  DATA = d;
  const mark = {
    live: '',
    partial: '（这次没跑完就限流了，下面是已经翻到的部分）',
    cache: '（走的本地存档，都是此前真查回来的原始结果）',
  }[d.source] || '';
  statusEl.textContent =
    `翻到 ${d.total} 条，横跨 ${d.span[0]}–${d.span[1]} 年，共 ${d.rings.length} 圈。` +
    `点圆上的年份，下面换那一年的原文。${mark}`;
  draw(d.rings);
  // 默认选中最近一年。文章区就在年轮下面，不摆出来的话，
  // 搜完看到的就只是一个孤零零的年轮，会以为没结果。
  // 这一次不滚屏：一搜索就把年轮顶出屏幕，人连自己搜的那句话什么形状都没看清。
  select(d.rings.length - 1);
  // parse 可能先于 rings 回来（或反过来），两边都调一次，谁后到谁负责画
  renderHint();
}

function toEmpty(d) {
  state = 'result';
  box.innerHTML = '';
  statusEl.textContent = d.source === 'limited'
    ? '知乎接口这会儿限流了（配额窗口），过一阵再试。'
    : '没翻到。换一句更像「常识」的话试试。';
  panel.innerHTML = '<p class="empty">' + (d.source === 'limited'
    ? '不是这句话没痕迹，是这次没查成 —— 不拿假数据糊弄你。'
    : '这句话在知乎上没留下足够的痕迹。') + '</p>';
}

function toError(msg) {
  state = 'result';
  box.innerHTML = '';
  statusEl.textContent = '出错了：' + msg;
  panel.innerHTML = '<p class="empty">检索失败，稍后再试。</p>';
}

/* ════════════════════════════════════════════════════════════
   2. 检索
   ════════════════════════════════════════════════════════════*/

async function search(q) {
  q = (q || '').trim();
  if (!q || state === 'loading') return;
  const token = ++searchToken;

  heroQ.value = q;
  tbQ.value = q;
  heroGo.disabled = tbGo.disabled = true;
  heroQ.blur(); tbQ.blur();

  hintbar.classList.remove('show');    // 上一句的建议不要留在屏幕上
  hideSug();                           // 推荐层也收起来，别挡着结果
  parseKind = null;
  toLoading(q);

  // 这两条都是**增强**，故意不 await：
  // 结果先照原话搜出来、先画出来，AI 回来再补。
  // 拿几秒的模型往返挡在搜索前面，换来的是"每次都多等一段"，不值。
  askParse(q, token);

  try {
    const res = await fetch('/api/rings?q=' + encodeURIComponent(q));
    const d = await res.json();
    if (d.error) throw new Error(d.error);
    if (!d.rings || !d.rings.length) toEmpty(d);
    else { toResult(d); askPicks(q, token); }
  } catch (e) {
    toError(e.message);
  } finally {
    heroGo.disabled = tbGo.disabled = false;
  }
}

/* ════════════════════════════════════════════════════════════
   2b. AI 的两条增强
   ════════════════════════════════════════════════════════════
   服务端不把 AI 调用挂在请求上等（那个端点能从 5 秒抖到 4 分钟），
   而是起了后台任务、立刻返回 {pending:true}，所以这边得轮询。
   两条都**不阻塞**、失败都静默：AI 挂了页面照常能用，
   因为启发式的结果早就在页面上了。
   演示现场网络抽风，不能整个站点跟着塌。 */

async function pollAI(url, token, onReady, tries = 24) {
  // 先密后疏：一开始可能几秒就好，等久了就别再频繁打服务端
  const waits = [1200, 1500, 2000, 2500, 3000, 4000, 5000, 6000, 7000, 8000];
  for (let k = 0; k < tries; k++) {
    await new Promise(r => setTimeout(r, waits[k] || 8000));
    if (token !== searchToken) return;          // 已经搜下一句了，结果作废
    let d;
    try { d = await (await fetch(url)).json(); }
    catch (e) { continue; }                     // 网络抖一下不算失败，接着轮
    if (d && d.ok) { onReady(d); return; }
    if (d && !d.pending) return;                // 明确失败（没配 key 等），别再轮
  }
}

/* 候选说法条。
   ─────────────────────────────────────────────────────────────
   AI 只负责「判断输入是哪一类」，候选**不靠模型生成** —— 用的是
   `DATA.related`，也就是这次检索真实捞回来的高赞标题。
   这么做的理由：模型凭旧知识猜的句子常跟语料对不上（实测对「张雪峰」
   它猜「张雪峰的观点有事实依据」，而语料里高赞的全是
   「张雪峰到底靠不靠谱?」这类）；真实标题不用生成、不用等、也不可能编造。

   两条竞态要注意：parse 和 rings 谁先回来不一定，所以两边都调
   renderHint()，谁后到谁负责画。 */
function renderHint() {
  if (!parseKind || !DATA || !DATA.related || !DATA.related.length) return;
  if (parseKind === 'claim') {          // 断言输入不用纠正
    hintbar.classList.remove('show');
    return;
  }

  const q = DATA.query;
  const label = parseKind === 'question'
    ? '你输入的是个问题。这次捞回来的讨论里，大家实际在问的是这些：'
    : parseKind === 'garbage'
      ? '这句里我们看不出可查的主体。换个说法试试：'
      : '「' + q + '」是个话题，不是断言。这次捞回来的讨论集中在这些说法上：';

  hintbar.innerHTML =
    '<span class="hb-label">' + esc(label) + '</span>' +
    DATA.related.map(r =>
      '<button class="hb-chip" data-q="' + esc(r.title) + '" title="' + esc(r.title) + '">' +
      esc(clip(r.title, 26)) + '</button>'
    ).join('') +
    '<button class="hb-close" aria-label="忽略这条建议">×</button>';
  hintbar.classList.add('show');
}

/* 太长的标题在按钮里放不下，截断显示；完整的那句挂在 title 和 data-q 上 */
function clip(s, n) {
  s = s || '';
  return s.length > n ? s.slice(0, n - 1) + '…' : s;
}

function askParse(q, token) {
  const url = '/api/parse?q=' + encodeURIComponent(q);
  pollAI(url, token, d => {
    parseKind = d.kind;          // 只取分类，不取候选
    renderHint();
  });
}

function askPicks(q, token) {
  const url = '/api/picks?q=' + encodeURIComponent(q);
  pollAI(url, token, d => {
    if (!DATA || !DATA.rings) return;
    let touched = false;
    for (const r of DATA.rings) {
      const p = d.picks[String(r.year)];
      if (!p) continue;
      r.summary = p.summary;                 // 句子仍是知乎原文，只是换了一句
      r.summary_from = p.summary_from;
      r.summary_url = p.summary_url;
      r.summary_is_ai = true;
      if (selected != null && DATA.rings[selected] === r) touched = true;
    }
    if (touched) render(DATA.rings[selected]);   // 正在看的那一年就地更新
  });
}

/* ════════════════════════════════════════════════════════════
   3. 等待时的占位
   ════════════════════════════════════════════════════════════
   十几条查询串行跑要几十秒。这段时间里不能只甩一行字，
   但也不该再放一遍开场动画 —— 开场那个是"进门"，这里是"在干活"。
   年轮位置画一组呼吸的空圈：这东西天生就该一圈圈长出来。 */

function skeleton() {
  box.innerHTML = '';
  box.classList.remove('anim');
  measure();
  box.setAttribute('viewBox', `0 0 ${VW} ${VH}`);

  const cx = VW / 2, cy = VH / 2;
  // 空圈按最终布局的量级铺开，等结果出来时尺度不会突变
  const r0 = GEO.r0;
  const Rmax = Math.max(VW, VH) / 2 * GEO.tex;   // 跟 draw() 的纹理环同一口径
  const g = el('g', { class: 'skeleton' });
  for (let i = 0; i < 9; i++) {
    const r = r0 + (Rmax - r0) * (i / 8);
    const c = el('circle', { cx, cy, r });
    c.style.setProperty('--d', (i * 0.14).toFixed(2) + 's');
    g.appendChild(c);
  }
  g.appendChild(el('text', { x: cx, y: cy + 4, class: 'loadword' }, '翻旧账中'));
  box.appendChild(g);
}

/* ════════════════════════════════════════════════════════════
   4. 年轮
   ════════════════════════════════════════════════════════════*/

function el(tag, attrs, text) {
  const n = document.createElementNS(SVG, tag);
  for (const k in attrs) n.setAttribute(k, attrs[k]);
  if (text != null) n.textContent = text;
  return n;
}

/* 节点半径：讨论量映射像素。用开方压一下，
   免得某一年爆量就把别的年份压成看不见的小点。
   现在环大了，点也跟着放大一档，数据量的差别才看得出来。 */
function nodeR(count, max) {
  const t = max > 0 ? Math.sqrt(count / max) : 0;
  return 5 + t * 11;
}

/* 圆环解算：年份沿一个正圆均匀排开，圆心就是这块框的正中。
   ─────────────────────────────────────────────────────────
   排布：从正上方（12 点）起，顺时针一年一格，转满一圈。

   半径不能只按「框的短边除以二」一刀切：标签是横排的两行字，
   在上下两端吃掉的是它的高度、在左右两端吃掉的是它的宽度，差一倍多。
   所以逐年按它自己的角度，把标签盒在半径方向上的半投影算进去，
   再取所有年份里最紧的那个当上限 —— 这样圆的每一段都恰好顶着框的
   边界，不会一边浪费、一边越界。 */
function solveCircle(rings, vw, vh) {
  const { margin, gap } = GEO;
  const n = rings.length;
  const lb = labelBox(n, vw);
  const cx = vw / 2, cy = vh / 2;
  const maxCount = Math.max(...rings.map(r => r.count));
  const halfW = lb.w / 2, halfH = lb.h / 2;
  const step = 2 * Math.PI / n;

  const angs = [], nrs = [];
  let R = Infinity;

  rings.forEach((r, i) => {
    const th = -Math.PI / 2 + i * step;      // 正上方起，顺时针
    const nr = nodeR(r.count, maxCount);
    angs.push(th); nrs.push(nr);

    const A = Math.abs(Math.cos(th)), B = Math.abs(Math.sin(th));
    const reach = nr + gap + (A * halfW + B * halfH);   // 标签中心离圆心至少这么远
    if (A > 1e-6) R = Math.min(R, (cx - margin - halfW) / A - reach);
    if (B > 1e-6) R = Math.min(R, (cy - margin - halfH) / B - reach);
  });

  // 中心留白跟着圆走：圆小了，那句话的地盘也得收，别把年份挤了
  const r0 = Math.max(30, Math.min(GEO.r0, R - 26));
  return { cx, cy, R, r0, angs, nrs, lb };
}

function draw(rings) {
  box.innerHTML = '';
  box.classList.remove('anim');
  if (!rings.length) return;

  measure();
  box.setAttribute('viewBox', `0 0 ${VW} ${VH}`);

  const n = rings.length;
  const { cx, cy, R, r0, angs, nrs, lb } = solveCircle(rings, VW, VH);

  // 背景层：同心环是这块的纹理，不是主角。按**长边**铺开，
  // 让环线横着也能顶到框边（超出的由 overflow 裁掉）——
  // 圆心居中之后圆本身不大，纹理只铺到圆外一圈的话两头会空一大片。
  const texMax = Math.max(VW, VH) / 2 * GEO.tex;
  for (let i = 0; i < n; i++) {
    const r = r0 + (texMax - r0) * (n > 1 ? i / (n - 1) : 0);
    const c = el('circle', { cx, cy, r, class: 'ring' });
    c.style.setProperty('--len', (2 * Math.PI * r).toFixed(1));
    c.style.setProperty('--d', (i * 0.09).toFixed(2) + 's');
    box.appendChild(c);
  }
  // 年份落在这个圆上，比别的纹理环明确一点，看得出年份是「一圈」
  const onRing = el('circle', { cx, cy, r: R, class: 'ring on' });
  onRing.style.setProperty('--len', (2 * Math.PI * R).toFixed(1));
  onRing.style.setProperty('--d', '0s');
  box.appendChild(onRing);

  // 中心：那句话本身。先挖一块纸色盘，否则字会压在环线上。
  const g0 = el('g', {});
  g0.appendChild(el('circle', { cx, cy, r: r0, class: 'seedhole' }));
  g0.appendChild(el('circle', { cx, cy, r: r0 - 10, fill: 'none',
                                stroke: 'var(--ink)', 'stroke-width': 1.4 }));

  // 一行最多 5 字，最多两行。留白直径约 2×r0，放得下。
  const q = (DATA.query || '').trim();
  const lines = [];
  for (let i = 0; i < q.length && lines.length < 2; i += 5) lines.push(q.slice(i, i + 5));
  if (q.length > 10) lines[1] = lines[1].slice(0, 4) + '…';

  const baseY = lines.length > 1 ? cy - 12 : cy - 4;
  lines.forEach((ln, i) => {
    g0.appendChild(el('text', { x: cx, y: baseY + i * 18, class: 'seedtext' }, ln));
  });
  // 总条数 + 年份跨度：进来就知道体量
  g0.appendChild(el('text', { x: cx, y: baseY + lines.length * 18 + 6, class: 'seedsub' },
    `${DATA.total} 条 · ${DATA.span ? DATA.span[0] + '–' + DATA.span[1] : ''}`));
  box.appendChild(g0);

  // 年份节点：绕正圆均匀一圈
  rings.forEach((r, i) => {
    const th = angs[i], nr = nrs[i];
    const ux = Math.cos(th), uy = Math.sin(th);
    const x = cx + R * ux, y = cy + R * uy;
    const delay = (i * 0.09 + 0.3).toFixed(2) + 's';

    const g = el('g', { class: 'node', tabindex: '0', role: 'button',
                        'aria-label': `${r.year} 年，${r.count} 条` });
    g.style.setProperty('--d', delay);
    g.appendChild(el('circle', { cx: x, cy: y, r: nr }));

    // 标签沿半径往外推：推过「节点外缘 + gap + 标签在半径方向的半投影」，
    // 这样标签的内缘贴着节点、外缘贴着框边，两边都不挤。
    // 用 middle 对齐而不是左/右对齐：绕一整圈时，左半边右对齐、
    // 右半边左对齐会在中轴处出现「背靠背贴死」的缝（踩过）。
    const A = Math.abs(ux), B = Math.abs(uy);
    const lr = R + nr + GEO.gap + (A * lb.w / 2 + B * lb.h / 2);
    const lx = cx + lr * ux, ly = cy + lr * uy - lb.yr * 0.24;

    const yr = el('text', { x: lx, y: ly, 'text-anchor': 'middle', class: 'yr' }, r.year);
    yr.style.fontSize = lb.yr + 'px';
    g.appendChild(yr);
    const cnt = el('text', { x: lx, y: ly + lb.cnt + 4, 'text-anchor': 'middle', class: 'cnt' },
                   r.count + ' 条');
    cnt.style.fontSize = lb.cnt + 'px';
    g.appendChild(cnt);

    const pick = () => select(i, true);
    g.addEventListener('click', pick);
    g.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); pick(); }
    });
    box.appendChild(g);
  });

  void box.getBoundingClientRect();
  box.classList.add('anim');
}

/* 选中某一年。
   scroll=true 才滚屏，而且只由「人主动点年份」触发 —— 他点了，
   说明现在想看那一年的原文，就把他送下去。
   搜完那次自动选中传 false：一搜索就把年轮顶出屏幕，人连自己
   搜的那句话长什么形状都没看清。 */
function select(i, scroll) {
  selected = i;
  document.querySelectorAll('.node').forEach((g, k) => g.classList.toggle('sel', k === i));
  render(DATA.rings[i]);
  if (scroll) {
    // 76 = 顶栏高度（#main 的 padding-top），让文章区正好停在顶栏下面
    const top = panel.getBoundingClientRect().top + window.scrollY - 76;
    window.scrollTo({ top, behavior: 'smooth' });
  }
}

/* ════════════════════════════════════════════════════════════
   5. 文章区（年轮下面第二节）
   ════════════════════════════════════════════════════════════*/

function esc(s) {
  return (s || '').replace(/[&<>"]/g,
    c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
}

function render(r) {
  const total = Math.max(r.believe + r.doubt + r.mixed, 1);
  const pct = (v) => (v / total * 100).toFixed(1) + '%';

  const items = r.answers.map(a => `
    <a class="item" href="${esc(a.url)}" target="_blank" rel="noopener noreferrer">
      <div class="t">${esc(a.title)}</div>
      <div class="x">${esc(a.excerpt)}</div>
      <div class="f">
        <span>${esc(a.author)}</span>
        <span>${a.votes} 赞同</span>
        <span>${a.comments} 评论</span>
        <span class="tag ${a.stance === 'doubt' ? 'd' : (a.stance === 'believe' ? 'b' : '')}">${
          a.stance === 'doubt' ? '偏质疑' : (a.stance === 'believe' ? '偏支持' : '两说')
        }</span>
        <span>${esc(a.type)}</span>
      </div>
    </a>`).join('');

  panel.innerHTML = `
    <div class="yearhead">
      <h2>${r.year}</h2>
      <span class="meta">这一年翻到 ${r.count} 条</span>
    </div>

    <div class="summary">
      <p>「${esc(r.summary)}」</p>
      <div class="from">
        当年 ${r.count} 条里，${r.summary_is_quote ? '说得最直白的一句' : '没有长度合规的整句，这是截断'}${r.summary_is_ai ? '<span class="aibadge">AI 挑句</span>' : ''}
        · <em>${esc(r.summary_from)}</em>
      </div>
    </div>

    <div class="bar">
      <i class="b" style="width:${pct(r.believe)}"></i>
      <i class="d" style="width:${pct(r.doubt)}"></i>
      <i class="m" style="width:${pct(r.mixed)}"></i>
    </div>
    <div class="barlegend">
      <span><i class="dotb"></i>偏支持 <b>${r.believe}</b></span>
      <span><i class="dotd"></i>偏质疑 <b>${r.doubt}</b></span>
      <span><i class="dotm"></i>两说 <b>${r.mixed}</b></span>
    </div>

    <div class="list">${items}</div>

    <p class="note">
      说到底这里只有两件事是硬的：年份取自知乎给的编辑时间，链接指向原文，点开就能核。
      立场那一栏是按词判的，只够用来看个走向，不作数。<br>
      说中的和没说中的都在上面 —— 只留下说对的那几个，等于骗你。
    </p>`;
}

/* ════════════════════════════════════════════════════════════
   5b. 输入推荐
   ════════════════════════════════════════════════════════════
   输入关键词就出，比整条检索早得多 —— 因为服务端只发**一条**搜索
   （0.76s），不是那 15 条扇出（13s）。
   候选是知乎给出的真实标题，点了就拿它去搜完整的那一轮。
   这是增强项，失败静默：不挡输入、不挡回车。

   **首屏和顶栏两个输入框都要挂。** 只挂首屏的话会有个很明显的 bug：
   搜过一次之后首屏就藏起来了，能打字的是顶栏那个，于是"再输入就没推荐了"。 */
function initSuggest(input, box) {
  let timer = null, seq = 0;

  function close() {
    clearTimeout(timer);
    seq++;                        // 作废还在路上的那次请求
    box.classList.remove('show');
    box.innerHTML = '';
  }

  async function load(q) {
    const my = ++seq;
    try {
      const d = await (await fetch('/api/suggest?q=' + encodeURIComponent(q))).json();
      if (my !== seq) return;     // 回来时已经不是当初那次（改了字 / 已开搜 / 已关掉）
      if (!d || !d.ok || !d.items || !d.items.length) { close(); return; }
      box.innerHTML =
        '<div class="s-hd">知乎上真实存在的说法，点一条直接查</div>' +
        d.items.map(it =>
          '<button data-q="' + esc(it.title) + '" title="' + esc(it.title) + '">' +
          '<span class="s-t">' + esc(it.title) + '</span>' +
          '<span class="s-v">' + it.votes + ' 赞</span></button>'
        ).join('');
      box.classList.add('show');
    } catch (e) { /* 推荐是增强项，失败就算了 */ }
  }

  input.addEventListener('input', () => {
    clearTimeout(timer);
    seq++;                        // 打字期间，之前那次的结果一律作废
    const q = input.value.trim();
    if (q.length < 2) { box.classList.remove('show'); box.innerHTML = ''; return; }
    // 400ms 没再敲才发请求：一个词打下来只发一两次，不是每敲一个键发一次
    timer = setTimeout(() => load(q), 400);
  });

  box.addEventListener('click', e => {
    const b = e.target.closest('button[data-q]');
    if (!b) return;
    close();
    search(b.dataset.q);
  });

  return close;
}

const closeHeroSug = initSuggest(heroQ, heroSug);
const closeTbSug = initSuggest(tbQ, tbSug);

function hideSug() { closeHeroSug(); closeTbSug(); }

// 点别处收起推荐（两个输入框各自的容器都算"里面"）
document.addEventListener('click', e => {
  if (!e.target.closest('.hero-search') && !e.target.closest('.tb-search')) hideSug();
});

/* ════════════════════════════════════════════════════════════
   6. 绑定
   ════════════════════════════════════════════════════════════*/

heroGo.addEventListener('click', () => search(heroQ.value));
heroQ.addEventListener('keydown', e => { if (e.key === 'Enter') search(heroQ.value); });
tbGo.addEventListener('click', () => search(tbQ.value));
tbQ.addEventListener('keydown', e => { if (e.key === 'Enter') search(tbQ.value); });

document.querySelectorAll('.hero-hints button').forEach(b => {
  b.addEventListener('click', () => search(b.dataset.q));
});

// 候选说法条：点一条就按那条重搜；点 × 只收起来，不打断当前结果
hintbar.addEventListener('click', e => {
  const chip = e.target.closest('.hb-chip');
  if (chip) {
    hintbar.classList.remove('show');
    search(chip.dataset.q);
    return;
  }
  if (e.target.closest('.hb-close')) hintbar.classList.remove('show');
});

// 点顶栏标题回首屏，重新来一次
tbHome.addEventListener('click', () => {
  state = 'idle';
  topbar.classList.remove('visible');
  mainEl.classList.remove('visible');
  panel.innerHTML = '';
  box.innerHTML = '';
  hintbar.classList.remove('show');
  hintbar.innerHTML = '';
  hideSug();
  searchToken++;              // 让还在路上的 AI 结果作废
  parseKind = null;
  DATA = null; selected = null;
  window.scrollTo(0, 0);
  hero.style.opacity = '1';
  hero.style.pointerEvents = 'auto';
  heroQ.focus();
});

// 窗口变了要重排：年轮那块的宽高跟着变，整个圆的几何得重解
let rzTimer = null;
window.addEventListener('resize', () => {
  if (state !== 'result' || !DATA || !DATA.rings) return;
  clearTimeout(rzTimer);
  rzTimer = setTimeout(() => {
    const keep = selected;
    draw(DATA.rings);
    if (keep != null) {
      document.querySelectorAll('.node').forEach((g, k) => g.classList.toggle('sel', k === keep));
    }
  }, 160);
});

// 等 LiukanshanLoader 挂载完再起动画。
// 两个 <script> 在同一页面内，loader 的 script 在前，app.js 在后，
// 正常情况下 LiukanshanLoader 已经存在；但如果浏览器缓存/defer 导致
// 时序颠倒，就用 requestAnimationFrame 等一帧再试。
(function waitAndRun(retries) {
  if (window.LiukanshanLoader) {
    runOpening();
  } else if (retries > 0) {
    requestAnimationFrame(() => waitAndRun(retries - 1));
  } else {
    runOpening(); // 兜底：让 finish() 里的 !LiukanshanLoader 分支处理
  }
})(60); // 最多等 60 帧（约 1 秒）

</script>
</body>
</html>
